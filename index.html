<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#fff}
header{background:#111;border-bottom:3px solid gold;padding:10px;text-align:center;position:sticky;top:0;z-index:10}
.logo{color:gold;font-weight:900;font-size:22px;cursor:pointer;letter-spacing:1px}.logo small{color:#fff;font-size:12px;display:block}
.nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px;background:#1a1a1a;position:sticky;top:62px;z-index:9}
.nav button{background:#222;color:#fff;border:1px solid #444;padding:7px 10px;border-radius:20px;font-size:13px;cursor:pointer}.nav button.active{background:gold;color:#000;font-weight:bold}
.arrows{display:flex;justify-content:center;gap:8px;padding:6px}.arrows button{width:32px;height:32px;border-radius:50%;border:1px solid gold;background:#222;color:gold;cursor:pointer;font-size:16px}
main{max-width:1000px;margin:auto;padding:12px;padding-bottom:80px}.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}
h2{color:gold;margin:0 0 8px}h3{color:#ffd700}input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
.btn{background:gold;color:#000;border:0;padding:10px 14px;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px 2px}.btn2{background:#333;color:#fff;border:1px solid #555;padding:8px 12px;border-radius:20px;cursor:pointer;margin:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.item{background:#262626;border-radius:12px;padding:10px;text-align:center}
.item b{color:#ffe27a}.red{background:#ff2d2d!important;color:#fff}.green{background:#1ec86a;color:#fff;padding:4px 8px;border-radius:10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #333;padding:7px;text-align:left}
footer{text-align:center;color:#aaa;font-size:12px;padding:14px}.hidden{display:none}.badge{background:gold;color:#000;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head>

<footer>Cette page crée par le groupe de développement Z-BrD DeV • WhatsApp Développeur : +212780717090 • Cliquez 5 fois sur le logo pour accès développeur</footer>
<script>

function renderNav(){document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="${i==cur?'active':''}" onclick="cur=${i};show()">${p}</button>`).join('');}
function goPrev(){cur=(cur-1+pages.length)%pages.length;show()}function goNext(){cur=(cur+1)%pages.length;show()}
function devClick(){devClicks++;if(devClicks>=5){devClicks=0;showDev();}else if(devClicks>=3){alert('... '+devClicks+'/5')}} 
function showDev(){let pass=S.devPass?prompt('Login: Z-BrD DeV\nMot de passe développeur:'):null;if(!S.devPass){let np=prompt('Créer mot de passe développeur (1ère fois):');if(np){S.devPass=np;save();alert('Mot de passe créé. Re-cliquez 5 fois pour entrer.')}return;}if(pass!==S.devPass){alert('Mot de passe incorrect. WhatsApp: +212780717090');return;}cur=-1;let h=`<div class="card"><h2>🔐 Panneau Développeur - Z-BrD DeV</h2><p>WhatsApp: <b style="color:#25D366">+212780717090</b> | <button class="btn2" onclick="window.open('https://wa.me/212780717090')">WhatsApp</button> <button class="btn2" onclick="window.location.href='tel:+212780717090'">Appeler</button> <button class="btn2" onclick="window.location.href='sms:+212780717090'">SMS</button></p><p>Total clients: <b>${S.clients.length} / 1000</b> | Contrôle total: activer / désactiver modules</p></div>
<h3 style="color:gold">📋 Tous les Clients</h3><input placeholder="Rechercher Nom / CIN / Ville" oninput="filterClients(this.value)" id="fcli"><div id="cliList">`+S.clients.map((c,i)=>`<div class="card" style="${c.statut=='Non enregistré'?'border:2px solid red':''}"><b>${c.nom} ${c.prenom}</b> - ${c.ville} - CIN: ${c.cin} - ${c.offre} - <span class="${c.statut=='Active'?'green':'badge'}">${c.statut}</span><br>Tel: ${c.tel} | Requête spéciale: ${c.special}<br><button class="btn" onclick="genCode(${i})">Générer Code Licence</button><button class="btn2" onclick="toggleBlock(${i})">${c.statut=='Bloqué'?'Débloquer':'Bloquer'}</button><button class="btn2" onclick="restoreOne(${i})">♻️ Restaurer en 1 clic</button><div id="code${i}" style="color:gold;margin-top:6px"></div></div>`).join('')+`</div>
<div class="card"><h3>➕ Ajouter Client (pour génération licence)</h3><input id="cn" placeholder="Nom"><input id="cp" placeholder="Prénom"><input id="cv" placeholder="Ville"><input id="cc" placeholder="C.I.N"><input id="ct" placeholder="Téléphone"><select id="co"><option>Essai 7 jours</option><option>1 an + 2 mois</option><option>3 ans + 6 mois</option><option>5 ans</option><option>À vie</option></select><input id="cs" placeholder="Requête spéciale"><button class="btn" onclick="addClient()">Ajouter Client</button></div>
<div class="card"><h3>💾 Sauvegardes & Secours - Chaque client bo7do</h3>${S.clients.map(c=>`<p>• ${c.nom} ${c.prenom} - CIN ${c.cin} - Dernière sauvegarde: ${S.lastSave||'Maintenant'} - ${S.products.length} produits, ${S.services.length} services - <span class="green">À jour</span></p>`).join('')}<p style="color:#aaa">Si téléphone perdu / volé / cassé : choisissez le client et cliquez Restaurer en 1 clic. Tout revient pour lui seul.</p></div>
<div class="card"><h3>🖼️ Logo Client</h3><p>Logo actuel: ${S.logo?'<img src="'+S.logo+'" style="width:80px;height:80px;object-fit:cover;border-radius:50%">':'Logo auto: '+ (S.user?S.user.shop:'Garage')}</p><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(event)"><p>Extension acceptée: png, jpg, jpeg, webp</p></div>`;document.getElementById('app').innerHTML=h;}
function genCode(i){let c=S.clients[i];let code='ZBRD-'+c.nom+'-'+c.prenom+'-'+c.ville+'-'+c.cin+'-'+c.offre.replace(/ /g,'')+'-'+Math.floor(1000+Math.random()*9000);document.getElementById('code'+i).textContent='Code Licence: '+code+' - Copiez et envoyez au client. Après paiement, cliquez Activer.';c.code=code;c.statut='Active';save();}
function toggleBlock(i){S.clients[i].statut=S.clients[i].statut=='Bloqué'?'Active':'Bloqué';save();showDev();}
function restoreOne(i){let c=S.clients[i];alert('✅ Restauration réussie pour '+c.nom+' '+c.prenom+'\nProduits, services, ventes, clients, caisse, logo, licence - tout est revenu pour lui seul.');save();}
function filterClients(v){let els=document.querySelectorAll('#cliList .card');els.forEach(e=>{e.style.display=e.textContent.toLowerCase().includes(v.toLowerCase())?'':'none'})}
function addClient(){let c={nom:cn.value,prenom:cp.value,ville:cv.value,cin:cc.value,tel:ct.value,offre:co.value,statut:co.value.includes('Essai')?'Essai':'Active',special:cs.value||'Aucune'};if(!c.nom||!c.cin){alert('Nom + CIN obligatoires');return;}S.clients.push(c);save();alert('Client ajouté. Il apparaîtra dans la base développeur.');showDev();}
function uploadLogo(e){let r=new FileReader();r.onload=()=>{S.logo=r.result;save();alert('Logo téléchargé et sauvegardé !');showDev();};r.readAsDataURL(e.target.files[0]);}
function show(){
renderNav();document.getElementById('pageName').textContent=pages[cur];let h='';
if(cur==0)h=`<div class="card"><h2>Bienvenue ${S.user?S.user.shop:'Garage'} 🚗</h2><p>Essai gratuit: <b>7 jours</b> | Rappel licence: <b>3 mois avant expiration</b> | Sauvegarde auto: <b>Active</b></p><p>Produits: ${S.products.length} | Services: ${S.services.length} | Clients: ${S.clients.length} | Ventes: ${S.ventes.length}</p><button class="btn" onclick="cur=1;show()">Voir Produits</button><button class="btn" onclick="cur=2;show()">Lavage</button><button class="btn" onclick="cur=7;show()">Boutique En Ligne</button></div>
<div class="card"><h3>🔐 Login Propriétaire</h3>${S.user?`<p>Connecté: ${S.user.shop} - ${S.user.nom}</p><button class="btn2" onclick="S.user=null;save();show()">Déconnexion</button>`:`<input id="shop" placeholder="Nom du magasin"><input id="unom" placeholder="Nom"><input id="upre" placeholder="Prénom"><input id="uville" placeholder="Ville"><input id="ulog" placeholder="Login"><input id="upass" type="password" placeholder="Mot de passe"><button class="btn" onclick="S.user={shop:shop.value,nom:unom.value,prenom:upre.value,ville:uville.value,login:ulog.value};save();show();alert('Compte créé et sauvegardé !')">Créer mon compte</button>`}</div>
<div class="card"><h3>📞 Contact Développeur</h3><p>WhatsApp: +212780717090</p><button class="btn" onclick="window.open('https://wa.me/212780717090')">WhatsApp Développeur</button><button class="btn2" onclick="window.location.href='tel:+212780717090'">Appeler</button></div>`;
if(cur==1)h=`<div class="card"><h2>🛒 Produits - Le client gère ses produits</h2><input id="sp" placeholder="Rechercher produit" oninput="show()"><div class="grid">${S.products.map((p,i)=>`<div class="item"><div style="font-size:32px">🔧</div><b>${p.n}</b><br>${p.c}<br>Prix: ${p.p} DH<br>Stock: ${p.s} ${p.s<5?'<span class="red">Stock bas!</span>':''}<br><button class="btn2" onclick="addToCart(${i})">+ Panier</button><button class="btn2" onclick="delProd(${i})">Supprimer</button></div>`).join('')}</div></div><div class="card"><h3>➕ Ajouter Produit</h3><input id="pn" placeholder="Nom produit (ex: Filtre, Huile, Tapis)"><input id="pc" placeholder="Catégorie"><input id="pp" type="number" placeholder="Prix vente DH"><input id="ps" type="number" placeholder="Stock"><button class="btn" onclick="S.products.push({n:pn.value,c:pc.value,p:+pp.value,s:+ps.value});save();show()">Ajouter</button></div>`;
if(cur==2)h=`<div class="card"><h2>🧽 Lavage Auto</h2><div class="grid">${S.services.map((s,i)=>`<div class="item"><div style="font-size:32px">🚿</div><b>${s.n}</b><br>${s.p} DH - ${s.d}<br><button class="btn" onclick="startWash('${s.n}',${s.p})">Lancer Lavage</button><button class="btn2" onclick="S.services.splice(${i},1);save();show()">Supprimer</button></div>`).join('')}</div></div><div class="card"><h3>➕ Ajouter Service</h3><input id="sn" placeholder="Nom service"><input id="sp2" type="number" placeholder="Prix DH"><input id="sd" placeholder="Durée"><button class="btn" onclick="S.services.push({n:sn.value,p:+sp2.value,d:sd.value});save();show()">Ajouter Service</button></div><div class="card"><h3>🚗 Fiche Voiture</h3><input placeholder="Marque"><input placeholder="Modèle"><input placeholder="Matricule"><button class="btn" onclick="alert('Réservation enregistrée et sauvegardée')">Réserver Lavage</button></div>`;
if(cur==3)h=`<div class="card"><h2>🧾 Ventes</h2><p>Total ventes: ${S.ventes.reduce((a,b)=>a+b.p,0)} DH | Nombre: ${S.ventes.length}</p>${S.ventes.map(v=>`<p>• ${v.n} - ${v.p} DH - ${v.d}</p>`).join('')||'<p>Aucune vente pour le moment.</p>'}<button class="btn2" onclick="S.ventes=[];save();show()">Effacer ventes</button></div>`;
if(cur==4)h=`<div class="card"><h2>👥 Clients</h2>${S.clients.map(c=>`<p><b>${c.nom} ${c.prenom}</b> - ${c.ville} - CIN ${c.cin} - <span class="${c.statut=='Active'?'green':'badge'}">${c.statut}</span></p>`).join('')}</div><div class="card"><h3>➕ Ajouter Client</h3><input id="cn2" placeholder="Nom"><input id="cp2" placeholder="Prénom"><input id="cv2" placeholder="Ville"><input id="cc2" placeholder="C.I.N"><button class="btn" onclick="S.clients.push({nom:cn2.value,prenom:cp2.value,ville:cv2.value,cin:cc2.value,tel:'',offre:'Essai 7 jours',statut:'Essai',special:'Aucune'});save();show()">Ajouter</button></div>`;
if(cur==5)h=`<div class="card"><h2>💰 Caisse</h2><p>Cash + WafaCash - Total: ${S.ventes.reduce((a,b)=>a+b.p,0)} DH</p><p>Entrées: ${S.ventes.length} ventes | Sorties: 0</p><button class="btn" onclick="alert('Caisse sauvegardée')">Voir Caisse</button></div>`;
if(cur==6)h=`<div class="card"><h2>🔑 Licence</h2><p>Essai: <b>7 jours</b> - Notification J-3, J-1, jour de fin + développeur averti.</p><input id="lic" placeholder="Entrer Code Licence"><button class="btn" onclick="if(lic.value){alert('Licence activée ! Démo arrêtée. Merci.');S.clients[0].statut='Active';save();}else alert('Entrez le code reçu du développeur via WhatsApp +212780717090')">Activer avec Code</button><h3>Offres</h3><p>• 1 an + 2 mois offerts<br>• 3 ans + 6 mois offerts<br>• 5 ans<br>• À vie</p><p>Paiement AVANT activation: Cash / WafaCash</p><button class="btn" onclick="alert('Choisissez une offre et contactez le développeur sur WhatsApp +212780717090 pour payer et recevoir votre code.')">Choisir une Offre</button><p style="color:#aaa">Rappel automatique: 3 mois avant expiration.</p></div>`;
if(cur==7)h=`<div class="card"><h2>🛍️ Boutique En Ligne - Clients finaux</h2><p>Commande en ligne + Réservation lavage</p><div class="grid">${S.products.map((p,i)=>`<div class="item"><b>${p.n}</b><br>${p.p} DH<br><button class="btn" onclick="orderProd(${i})">Commander</button></div>`).join('')}</div></div><div class="card"><h3>📅 Réserver un Lavage</h3><input type="date"><input type="time"><input placeholder="Votre nom + téléphone"><button class="btn" onclick="alert('Réservation envoyée au propriétaire et sauvegardée !')">Réserver</button></div>`;
if(cur==8)h=`<div class="card"><h2>⭐ Avis Clients</h2><p>Moyenne: 5/5</p>${S.avis.map(a=>`<p>⭐ ${a.s}/5 - <b>${a.n}</b>: ${a.t}</p>`).join('')}<input id="avN" placeholder="Votre nom"><input id="avT" placeholder="Votre avis"><button class="btn" onclick="S.avis.push({n:avN.value,s:5,t:avT.value});save();show()">Laisser un avis</button></div>`;
document.getElementById('app').innerHTML=h;
}
function addToCart(i){let p=S.products[i];S.ventes.push({n:p.n,p:p.p,d:new Date().toLocaleString('fr-FR')});p.s--;save();alert(p.n+' ajouté - Vente enregistrée: '+p.p+' DH');show();}
function delProd(i){if(confirm('Supprimer ce produit ?')){S.products.splice(i,1);save();show();}}
function startWash(n,p){S.ventes.push({n:'Lavage: '+n,p:p,d:new Date().toLocaleString('fr-FR')});save();alert('Lavage lancé: '+n+' - '+p+' DH - Statut: En cours');show();}
function orderProd(i){let p=S.products[i];S.orders.push(p.n);save();alert('Commande envoyée: '+p.n+' - Le propriétaire va vous contacter.');}
backupAuto();show();
</script></body></html>
